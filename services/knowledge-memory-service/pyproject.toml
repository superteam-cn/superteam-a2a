[project]
name = "superteam-a2a-knowledge-memory-service"
version = "0.1.0"
description = "superteam-a2a Knowledge-Memory Service · D 方案单进程合并（ADR-0006 v1.0 Accepted）· KS + MEM 共享 Deployment · 4 A2A methods + admission + MemoryReconciler 60s timer + Lease"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

# L4 Step 1+2：核心依赖 + kopf（§4.1 timer + §4.4 finalize decorators）。
# 2026-08-05 #78 L4-Step3：加 kopf >=1.37 for @kopf.timer + @kopf.on.delete。
dependencies = [
    "pydantic>=2.10,<3",
    "superteam-a2a-a2a-core>=0.1.0",  # workspace 内部依赖
    "kopf>=1.37,<2",  # L3-6 §4.1 @kopf.timer 60s + L3-6 §4.4 @kopf.on.delete finalize
    "kubernetes_asyncio>=29.0.0",  # PR-2 K8sLeaseLeaderElector Lease client (coordination.k8s.io/v1)
    "starlette>=0.40,<1",  # PR-1 A2A HTTP JSON-RPC server (L4-Phase3 §2.1 选项 C)
    "uvicorn>=0.30,<1",  # PR-1 starlette ASGI runtime（同 kopf event loop · §16.1 单进程）
    "httpx>=0.27,<1",  # PR-1 starlette.testclient 依赖（TestClient in-process HTTP 测试）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]
