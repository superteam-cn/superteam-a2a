[project]
name = "superteam-a2a-hello-agent-service"
version = "0.1.0"
description = "superteam-a2a Hello Agent · Phase 4 PR-1 最小化实装（starlette ASGI + 单进程 8080 端口 + 4 Python runtime 指标）"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

# Phase 4 PR-1 最小化依赖（与 services/knowledge-memory-service/ 一致架构）
# 不依赖 google-a2a-sdk（L3-2 实装是后续 PR 范围 · #98 plan §2.1 调整）
dependencies = [
    "pydantic>=2.10,<3",
    "superteam-a2a-a2a-core>=0.1.0",  # workspace 内部依赖（stub 也保持）
    "starlette>=1.6.0,<2",  # ASGI app
    "uvicorn>=0.30,<1",  # ASGI runtime
    "httpx2>=2.0,<3",  # starlette TestClient in-process HTTP 测试
    "prometheus-client>=0.20,<1",  # 4 Python runtime 指标 + /metrics
    "structlog>=24.1.0,<25",  # 结构化日志（§9.7 8 字段）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]