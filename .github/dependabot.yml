version: 2
updates:
  # Python dependencies (uv workspace)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "chore"
      - "dependencies"
    groups:
      python-runtime:
        patterns:
          - "python"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "ruff"
          - "pyright"
          - "pytest"
          - "pytest-cov"
          - "mypy"
          - "pre-commit"
      framework-adapters:
        patterns:
          - "langchain"
          - "llamaindex"
          - "crewai"
          - "autogen"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # 不自动 squash；本项目 squash merge 由 reviewer 控制（CONTRIBUTING §PR 流程）
    # 不自动 rebase；避免误合

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "chore"
      - "ci"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  # Docker base images (L4 实施后启用)
  # 当前 L4 尚未启动；待 services/* Dockerfile 落地后取消注释
