name: e2e-envtest

# Phase 2 PR-4 kind cluster E2E workflow.
# Reference: docs/phase2/l4-phase2-spike-plan.md §2.5 + §3.4
#
# Triggers (Phase 2 plan §2.5 决策):
#   - workflow_dispatch: 手动触发 · 项目发起人 / 评审者按需
#   - schedule: nightly UTC 01:30（错峰避开 GitHub Actions UTC 14:00-22:00 高峰）
#   - pull_request labeled: 仅标 'e2e' label 的 PR 触发
#
# 不触发普通 PR push（避免 kind 启动阻塞 PR review · §2.5 决策）。
#
# NOTE: PR-4.1 chart 完整化已 merged（PR #27 #89 #90）。Docker image 在 workflow 中
# 本地 build + kind load docker-image 注入，避免 GHCR registry 依赖。
# LIFECYCLE-E2E-001/002 + LEADER-E2E-002 实装。H-RM-E2E-001/H-QM-E2E-001 仍 skipped
# （A2A HTTP JSON-RPC server 未实装，Phase 3 OPEN-MEMORY-002 候选）。

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-envtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    name: kind E2E spike
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        # NOTE: e2e-envtest 安装 uv via curl 而非 setup-uv action；保持原实现避免与 steps 顺序冲突

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Sync workspace
        run: python -m uv sync --all-packages

      - name: Create kind cluster
        run: |
          kind create cluster \
            --name e2e-${{ github.run_id }} \
            --image kindest/node:v1.30.0 \
            --wait 60s

      - name: Build Docker image (PR-4.1.1 #90)
        run: |
          docker buildx build \
            -f services/knowledge-memory-service/Dockerfile \
            -t local:e2e-${{ github.run_id }} \
            --load \
            .

      - name: Load image into kind (PR-4.1.1 #90)
        run: |
          kind load docker-image local:e2e-${{ github.run_id }} \
            --name e2e-${{ github.run_id }}

      - name: Apply CRDs (if available)
        run: |
          if [ -d "helm/knowledge-memory-service/crds" ]; then
            kubectl apply -f helm/knowledge-memory-service/crds/
          else
            echo "::warning::CRDs directory missing - E2E tests will skip via pytest.skip"
          fi

      - name: Helm install (with local image override, PR-4.1.1 #90)
        run: |
          if [ -f "helm/knowledge-memory-service/templates/deployment.yaml" ]; then
            helm install kmem helm/knowledge-memory-service/ \
              --namespace superteam-a2a-system --create-namespace \
              --set image.repository=local \
              --set image.tag=e2e-${{ github.run_id }} \
              --set image.pullPolicy=Never \
              --wait --timeout 120s
          else
            echo "::warning::deployment.yaml missing - E2E tests will skip via pytest.skip"
          fi

      - name: Run E2E tests
        run: |
          python -m uv run pytest tests/e2e/ \
            -v \
            --tb=short \
            -m e2e \
            -ra \
            || echo "::warning::Some E2E tests failed or skipped - see pytest output above"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "::group::kind cluster state"
          kind get clusters
          kubectl get nodes -o wide || true
          kubectl get pods -A || true
          echo "::endgroup::"

      - name: Delete kind cluster
        if: always()
        run: |
          kind delete cluster --name e2e-${{ github.run_id }} || true