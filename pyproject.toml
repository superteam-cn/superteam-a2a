# superteam-a2a — uv workspace root (L4 Step 1)
# 依据 L1 §4.1 + 宪法 v0.5.0 §3.8 (Python-first) + §9.7 (uv.lock 必须提交 + Ruff/Pyright strict)

[project]
name = "superteam-a2a"
version = "0.1.0"
description = "Multi-Framework Agent Orchestration on Kubernetes, powered by Google A2A protocol"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

[tool.uv]
# 统一工作区（7 packages + 2 services + 1 agent · #105 PR-3 Phase B 新增 knowledge + shared-visibility）
workspace = { members = [
    "packages/operator",
    "packages/a2a-core",
    "packages/adapter-sdk",
    "packages/knowledge",
    "packages/shared-visibility",
    "services/knowledge-memory-service",
    "services/hello-agent",
    "agents/hello",
] }

# Workspace 内部包依赖映射（uv 强制要求）
# 注意：发布到 PyPI 时需移除此段
[tool.uv.sources]
superteam-a2a-a2a-core = { workspace = true }
superteam-a2a-adapter-sdk = { workspace = true }
superteam-a2a-operator = { workspace = true }
superteam-a2a-knowledge = { workspace = true }
superteam-a2a-shared-visibility = { workspace = true }
superteam-a2a-knowledge-memory-service = { workspace = true }
superteam-a2a-hello-agent-service = { workspace = true }
superteam-a2a-hello-agent = { workspace = true }

# 强制开发依赖：所有 workspace member 共享（PEP 735 dependency-groups）
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.8,<1",
    "pyright>=1.1,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "psutil>=7.2.2,<8",  # HELLO-OBS-002 验证：prometheus_client ProcessCollector Windows 兼容
]

# ============================================================================
# Ruff: format + lint 合并门禁（宪法 §9.7）
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "uv.lock",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# 严格精选规则集（K8s operator + Pydantic 项目基线）
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
    "PT",  # pytest style
]
ignore = [
    "E501",  # line-too-long (formatter 处理)
    "B008",  # function call in default argument (Pydantic Field 必需)
    "RUF002",  # fullwidth punctuation in docstrings（双语 codebase 中文 docstring 标准）
    "RUF003",  # fullwidth punctuation in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # 允许 tests 使用 assert

# ============================================================================
# Pyright: strict mode（宪法 §9.7）
# ============================================================================
[tool.pyright]
include = [
    "packages/*/src",
    "services/*/src",
    "agents/*/src",
    "tests",
]
exclude = [
    ".venv",
    "build",
    "dist",
    "tests/unit/operator/test_memory_crd.py",  # 12 fixture-only tests 需 L4 Step 2 operator package 完整实装后再恢复
]
extraPaths = [
    "packages/operator/src",
    "packages/a2a-core/src",
    "packages/adapter-sdk/src",
    "services/knowledge-memory-service/src",
    "services/hello-agent/src",
    "agents/hello/src",
]
# CI Linux pyright auto-detection 需要显式 venvPath（uv sync 后 .venv 在 repo root）
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"
# 全局报告级别（strict 模式按需在 CI 启用，避免单文件 Pyright 误报阻塞）
reportMissingImports = "none"  # CI Linux venv auto-detection 不稳定 + import 由 pytest runtime 验证
reportMissingTypeStubs = "none"  # workspace 内部包无 stub 文件，Pyright 误报
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportMissingTypeArgument = "warning"
reportImplicitOverride = "error"
reportUntypedBaseClass = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"

# ============================================================================
# pytest: asyncio + 严格路径
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/conformance"]
# 注意：superteam_a2a 是 PEP 420 implicit namespace package（5 个 workspace 成员合并）。
# knowledge_memory 子包位于 services/knowledge-memory-service/src，operator 子包位于
# packages/operator/src。Python 在 sys.path 找到第一个 superteam_a2a/__init__.py 后停止
# 搜索后续子目录，因此 services 必须最前，operator 紧接其后（operator 在 backend/memory.py
# 中被 knowledge_memory 子包内部 import）。
pythonpath = [
    "services/knowledge-memory-service/src",
    "services/hello-agent/src",
    "packages/operator/src",
    "agents/hello/src",
    "packages/adapter-sdk/src",
    "packages/a2a-core/src",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Pydantic v2 内部警告，按需放开
    "ignore::DeprecationWarning:pydantic.*",
]
markers = [
    "integration: envtest + kind integration tests (skip on -m 'not integration')",
    "e2e: kind cluster end-to-end tests",
    "conformance: A2A wire contract conformance tests",
]