[project]
name = "superteam-a2a-a2a-core"
version = "0.1.0"
description = "superteam-a2a A2A Core Library · official a2a-sdk + 4 extended methods (queryKnowledge/getKnowledgeItem/recordMemory/queryMemory)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

# L4 Step 1：a2a-sdk / httpx 等 runtime 推迟到 #80+
dependencies = [
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]