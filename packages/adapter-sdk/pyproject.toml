[project]
name = "superteam-a2a-adapter-sdk"
version = "0.1.0"
description = "superteam-a2a Adapter SDK · typing.Protocol 契约 · framework-neutral adapter 模板"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

dependencies = [
    "pydantic>=2.10,<3",
    "superteam-a2a-a2a-core>=0.1.0",  # workspace 内部依赖
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]