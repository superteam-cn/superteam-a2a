[project]
name = "superteam-a2a-knowledge"
version = "0.1.0"
description = "Knowledge Service CRD types — Pydantic v2 (L3-5 v0.2.0)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

dependencies = [
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]