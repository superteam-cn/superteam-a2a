[project]
name = "superteam-a2a-operator"
version = "0.1.0"
description = "superteam-a2a Kubernetes Operator · Kopf handlers · 4 CRDs (Agent/AgentSet/Workflow/Memory) · MemoryReconciler"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "superteam-a2a contributors" },
]

dependencies = [
    "pydantic>=2.10,<3",
    "kubernetes-asyncio>=32.0,<33",
    "kopf>=1.37,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superteam_a2a"]