{{/*
Service for Knowledge Memory Service — Phase 1 single-port ClusterIP。
参考:
- docs/spec/L3-file-specs/L3-memory-backend.md §9.3 (line 1300-1313)
- L3-6 §9.3 原文: port 80→8080 (http) + port 443→8443 (https)
- Phase 1 简化 (values.yaml: service.port=8080, tls.enabled=false): 单 8080 直连
- Phase 2 spike 可选暴露 8443（tls.enabled=true 时）

443 承载 TLS 1.3 + mTLS A2A；80 仅 health/readiness/metrics。
不得添加 8081 或 IPC socket 对外入口（HELM-DEPLOY-003 已废弃）。
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-memory-service.fullname" . }}
  labels:
    {{- include "knowledge-memory-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-memory-service
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.tls.enabled }}
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    {{- end }}
  selector:
    {{- include "knowledge-memory-service.selectorLabels" . | nindent 4 }}