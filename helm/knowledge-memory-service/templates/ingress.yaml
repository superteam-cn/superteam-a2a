{{/*
Ingress for Knowledge Memory Service — 默认禁用（Phase 1 仅内部 ClusterIP）。
参考:
- docs/phase2/l4-phase2-spike-plan.md §2.7 cert-manager 决策（默认 tls.enabled=false）
- Phase 2+ 可启用：values.yaml ingress.enabled=true + 配置 hosts + tls

Phase 1 单进程 + tls.enabled=false：所有流量通过 service:8080 内部访问，
Ingress 仅作为外部接入的可选层。
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "knowledge-memory-service.fullname" . }}
  labels:
    {{- include "knowledge-memory-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "knowledge-memory-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}