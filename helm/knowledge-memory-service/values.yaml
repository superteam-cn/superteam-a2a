# Default values for knowledge-memory-service.
# Reference: docs/phase2/l4-phase2-spike-plan.md §2 设计决策

# Number of replicas (Phase 1 ADR-0006 D 方案：单进程 · schema 强制 == 1)
replicaCount: 1

image:
  repository: ghcr.io/superteam-cn/knowledge-memory-service
  pullPolicy: IfNotPresent
  tag: ""  # 默认与 Chart appVersion 同步

imagePullSecrets: []

# ServiceAccount 配置（PR-1 创建 · Helm 模板管理）
serviceAccount:
  create: true
  name: knowledge-service
  annotations: {}

# Pod-level 配置（Phase 1 ADR-0006 + L3-6 §9.2 共享 Deployment）
podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context（restricted profile · L3-6 §9.2 line 1284）
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Service 配置（Phase 1 单端口 8080 · A2A HTTP JSON-RPC · L4-Phase3 PR-1）
# 服务路由（starlette ASGI · D 方案单进程 · ADR-0006 v1.0 Accepted）：
#   GET  /healthz               livenessProbe + readinessProbe（共用 · PR-4.1.1 #90）
#   POST /jsonrpc/record_memory  JSON-RPC 2.0 envelope → record_memory_async
#   POST /jsonrpc/query_memory  JSON-RPC 2.0 envelope → query_memory_async
# /metrics 端口（PR-3 25 指标 ServiceMonitor · 暂未启用 · 当前端口仍 8080）
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress（默认禁用 · Phase 2+ 可启用 · 可选暴露 /jsonrpc/* 路由到集群外）
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# 资源限制（Phase 1 默认 · L3-6 §11.4 line 1689-1695）
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# 健康检查探针（L3-6 §11.4 + PR-4.1.1 #90 + L4-Phase3 PR-1 starlette /healthz）
# starlette ASGI 提供 /healthz（替换 kopf 内置 liveness_endpoint）；D 方案单进程共享端口 8080
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

# Leader Election 配置（PR-1 schema enum + 交叉验证 · Phase 2 §2.2/§2.3）
leaderElection:
  # enum: in_process | k8s
  # - in_process: 默认 · ADR-0006 D 方案单进程 · Phase 1 MVP
  # - k8s: Phase 2 spike · 需 replicaCount >= 2 + PR-1 RBAC 修复完成
  backend: in_process

# MemoryBackend 配置（L4-Phase3 PR-2 · production K8sBackend 可选启用）
# enum: in_process | k8s
# - in_process (default): dict-backed backend（Phase 1 MVP · dev/CI 默认）
# - k8s: CustomObjectsApi-backed backend（生产 · 需 PR-2 RBAC 权限已注入）
#   PR-2 实装完成（PR #34） · helm rbac.role_write.yaml 尚未包含 K8sBackend 完整
#   权限（Phase 4 单独 PR 补 RBAC） · 当前测试环境可用，生产环境待 RBAC 落地
backend:
  type: in_process
  k8s:
    # 仅 backend.type=k8s 时生效
    # 默认与 operator Memory CRD schema 对齐（自动注册 · 无需额外 CRD install）
    crdGroup: memory.superteam-a2a.io
    crdVersion: v1alpha1
    crdPlural: memories
    # K8sBackend list query timeout · list path 用 asyncio.wait_for 包住
    listTimeoutSeconds: 30

# kopf operator 配置（L3-6 §4.1 timer interval=60s + §4.4 finalize decorator）
operator:
  logLevel: INFO  # kopf 日志级别：DEBUG / INFO / WARNING / ERROR

# TLS / cert-manager 配置（Phase 2 §2.7 默认禁用）
tls:
  enabled: false
  secretName: knowledge-service-tls

# RBAC 配置（PR-1 · 7 apiGroups + 共享 SA）
rbac:
  create: true

# ServiceMonitor（Prometheus · L3-6 §9.8 line 1504 · 25 指标聚合）
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

# PrometheusRule（8 告警 · L3-6 §9.7 line 1387-1486）
prometheusRule:
  enabled: false

# NetworkPolicy（default-deny + 显式 allow · L3-6 §9.6 line 1367-1381）
networkPolicy:
  enabled: false

# 调度配置（默认不调度到 control-plane · L3-6 §9.9 line 1511）
nodeSelector: {}
tolerations: []
affinity: {}

# 注解（部署标识）
annotations: {}